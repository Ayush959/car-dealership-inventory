name: Test and build
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: python -m pytest --cov --cov-fail-under=95
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start demo services
        run: |
          python -m backend.seed
          python -m uvicorn backend.app:create_app --factory --port 8000 > /tmp/motorhaus-api.log 2>&1 &
          cd frontend
          npm run dev > /tmp/motorhaus-ui.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health && curl -fsS http://127.0.0.1:5173 > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
